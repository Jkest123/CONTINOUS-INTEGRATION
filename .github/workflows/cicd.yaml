
name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: strategyhub-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  ECR_REPOSITORY: strategyhub-container

jobs:
  quality:
    name: Lint, test, and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production assets
        run: npm run build

  deploy:
    name: Build, push, and deploy to Strategyhub ECS
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment variables
        shell: bash
        run: |
          required=(
            AWS_REGION
            AWS_ROLE_ARN
            ECS_CLUSTER
            ECS_SERVICE
            ECS_TASK_FAMILY
            CONTAINER_NAME
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository variable $name is missing."
              exit 1
            fi
          done



      - name: Debug GitHub OIDC claims (temporary)
        shell: bash
        env:
          OIDC_AUDIENCE: sts.amazonaws.com
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")

          ID_TOKEN=$(jq -r '.value' <<< "$TOKEN_JSON")

          PAYLOAD=$(python3 -c '
          import base64, json, sys
          part = sys.argv[1].split(".")[1]
          part += "=" * (-len(part) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(part))))
          ' "$ID_TOKEN")

          jq '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            event_name,
            environment
          }' <<< "$PAYLOAD"



      
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Strategyhub image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy and wait for ECS service stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
